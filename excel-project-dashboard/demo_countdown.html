<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>验收倒计时 Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #f5f5f5; padding: 20px; }
  h2 { margin-bottom: 16px; color: #333; }
  .subtitle { color: #666; font-size: 13px; margin-bottom: 20px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
  th { background: #1e293b; color: #fff; padding: 10px 14px; text-align: left; font-size: 13px; font-weight: 500; }
  td { padding: 10px 14px; border-bottom: 1px solid #e5e7eb; font-size: 13px; }
  tr:hover { background: #f8fafc; }
  .countdown { display: flex; flex-direction: column; gap: 4px; }
  .countdown-row { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .phase { color: #6b7280; min-width: 30px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.red { background: #ef4444; }
  .dot.yellow { background: #f59e0b; }
  .dot.green { background: #22c55e; }
  .days { font-weight: 600; }
  .days.red { color: #ef4444; }
  .days.yellow { color: #f59e0b; }
  .days.green { color: #22c55e; }
  .done { color: #9ca3af; font-size: 12px; }
  .na { color: #d1d5db; font-size: 12px; }
  .legend { display: flex; gap: 20px; margin-bottom: 16px; font-size: 13px; color: #555; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
</style>
</head>
<body>

<h2>区域 D — 项目清单（新增倒计时列 Demo）</h2>
<div class="subtitle">模拟数据 | 假设今天 = 2026-07-13</div>

<div class="legend">
  <div class="legend-item"><span class="dot red"></span> 超期 / ≤7天</div>
  <div class="legend-item"><span class="dot yellow"></span> 8~30天</div>
  <div class="legend-item"><span class="dot green"></span> >30天</div>
</div>

<table>
<thead>
  <tr>
    <th>#</th>
    <th>项目名称</th>
    <th>项目经理</th>
    <th>计划初验</th>
    <th>计划终验</th>
    <th>状态</th>
    <th>⏱️ 验收倒计时</th>
  </tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<script>
// 模拟数据（基于真实台账结构）
const projects = [
  { name: "基于多传感集成的电力设备运行状态监测系统", manager: "吕前程", planInit: "", planFinal: "2026-07-20", actualInit: "", actualFinal: "", status: "待终验" },
  { name: "2026年四川华电珙县15套电压传感器采购", manager: "刘诚", planInit: "", planFinal: "2026-07-31", actualInit: "", actualFinal: "", status: "待终验" },
  { name: "2025年南方电网数字变电站改造代工(小涉站)", manager: "吴湛", planInit: "", planFinal: "2026-07-30", actualInit: "", actualFinal: "", status: "待终验" },
  { name: "2026年南网传感公司智能制造部商机项目", manager: "张三", planInit: "", planFinal: "2026-08-15", actualInit: "", actualFinal: "", status: "待终验" },
  { name: "威胜信息框架第十九批2000套传感器", manager: "刘诚", planInit: "", planFinal: "2026-09-30", actualInit: "", actualFinal: "", status: "待终验" },
  { name: "2025年鹏扬智能科技第六批40套传感器", manager: "刘诚", planInit: "", planFinal: "2026-06-22", actualInit: "", actualFinal: "2026-06-22", status: "待结算" },
  { name: "四川汇源多物理量第七批130套传感器", manager: "刘诚", planInit: "", planFinal: "2026-12-31", actualInit: "", actualFinal: "", status: "待终验" },
  { name: "南京四方亿能第十批90套传感器", manager: "刘诚", planInit: "2026-07-10", planFinal: "2026-10-15", actualInit: "", actualFinal: "", status: "待初验" },
  { name: "2026年广州东方电科1719套传感器", manager: "刘诚", planInit: "", planFinal: "2026-06-29", actualInit: "", actualFinal: "2026-06-29", status: "待结算" },
  { name: "北京华电云通油色谱订单项目", manager: "刘诚", planInit: "", planFinal: "2027-03-01", actualInit: "", actualFinal: "", status: "待终验" },
];

const TODAY = new Date("2026-07-13");

function daysBetween(dateStr) {
  if (!dateStr) return null;
  const target = new Date(dateStr);
  const diff = Math.ceil((target - TODAY) / (1000 * 60 * 60 * 24));
  return diff;
}

function getColor(days) {
  if (days <= 7) return "red";
  if (days <= 30) return "yellow";
  return "green";
}

function formatCountdown(days, actualDone) {
  if (actualDone) return `<span class="done">已验收</span>`;
  if (days === null) return `<span class="na">—</span>`;
  if (days < 0) return `<span class="days red">⚠️ 超期${Math.abs(days)}天</span>`;
  if (days === 0) return `<span class="days red">今天</span>`;
  const color = getColor(days);
  return `<span class="days ${color}">${days}天</span>`;
}

function renderRow(p, idx) {
  const daysInit = daysBetween(p.planInit);
  const daysFinal = daysBetween(p.planFinal);
  const initDone = p.actualInit && p.actualInit !== "";
  const finalDone = p.actualFinal && p.actualFinal !== "";

  const initHtml = p.planInit
    ? `<div class="countdown-row"><span class="phase">初验</span><span class="dot ${initDone ? '' : getColor(daysInit)}"></span>${formatCountdown(daysInit, initDone)}</div>`
    : `<div class="countdown-row"><span class="phase">初验</span><span class="na">—</span></div>`;

  const finalHtml = `<div class="countdown-row"><span class="phase">终验</span><span class="dot ${finalDone ? '' : getColor(daysFinal)}"></span>${formatCountdown(daysFinal, finalDone)}</div>`;

  return `<tr>
    <td>${idx + 1}</td>
    <td>${p.name}</td>
    <td>${p.manager}</td>
    <td>${p.planInit || "—"}</td>
    <td>${p.planFinal || "—"}</td>
    <td>${p.status}</td>
    <td><div class="countdown">${initHtml}${finalHtml}</div></td>
  </tr>`;
}

document.getElementById("tbody").innerHTML = projects.map(renderRow).join("");
</script>
</body>
</html>
